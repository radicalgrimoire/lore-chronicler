name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test .\tests\Chronicler.Tests\Chronicler.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish .\src\Chronicler\Chronicler.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\Chronicler-win-x64

      - name: Archive release
        run: Compress-Archive -Path .\artifacts\Chronicler-win-x64\* -DestinationPath .\artifacts\Chronicler-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .\artifacts\Chronicler-win-x64.zip
